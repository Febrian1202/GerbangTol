[package]
name = "GerbangTol"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
tokio = { version = "1.53.1", features = ["full"] }

sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "macros", "uuid", "chrono", "migrate"] }
dotenv = "0.15.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
